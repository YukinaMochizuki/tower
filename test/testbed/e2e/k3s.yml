---
# Single-node k3s server on the provisioned VM. Mirrors ardge-cloud-infra's install (same get.k3s.io
# one-liner + pinned version), trimmed to what a disposable integration cluster needs. --tls-san adds
# 127.0.0.1 to the API cert so kubectl works when the API is reached over the driver's byte-pipe.
- name: Install k3s (single-node server)
  hosts: all
  become: true
  gather_facts: false
  vars:
    # Plain default; the driver overrides with `-e k3s_version=...` (extra-vars win). Do NOT write
    # `{{ k3s_version | default(...) }}` here — a var referencing itself is a template recursion error.
    k3s_version: "v1.34.8+k3s1"
  pre_tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        timeout: 180
        sleep: 5
  tasks:
    - name: Install k3s server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          INSTALL_K3S_EXEC="server --cluster-init --bind-address=0.0.0.0 --tls-san=127.0.0.1 --write-kubeconfig-mode=0644" \
          sh -
      args:
        creates: /usr/local/bin/k3s
    # --write-kubeconfig-mode=0644 is in the server args (not a one-off chmod) because k3s rewrites the
    # kubeconfig on EVERY start — a golden clone boots k3s fresh, so a build-time chmod would be lost.
    - name: Wait for the node to be Ready
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
      changed_when: false
      register: node_ready
      retries: 10
      delay: 10
      until: node_ready is succeeded
