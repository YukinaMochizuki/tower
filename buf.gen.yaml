version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/YukinaMochizuki/hangar/gen/go
clean: true
plugins:
  - local: [go, tool, protoc-gen-go]
    out: gen/go
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: gen/go
    opt: paths=source_relative
  - local: node_modules/.bin/protoc-gen-es
    out: gen/ts/src
    opt: target=ts
