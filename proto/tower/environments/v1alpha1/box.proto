syntax = "proto3";

package tower.environments.v1alpha1;

import "google/protobuf/timestamp.proto";
import "tower/environments/v1alpha1/common.proto";
import "tower/environments/v1alpha1/machine.proto";
import "tower/meta/v1/meta.proto";
import "tower/meta/v1/options.proto";

// Box is a working copy an agent edits, builds and runs things in: one or
// more repositories checked out in a container on the project's target.
// workstream applies it and watches it; tower decides the rest. A box tower
// stopped for idleness keeps this object and runs again on its next use.
// See docs/decisions/declarative-api.md.
message Box {
  option (tower.meta.v1.resource) = {
    kind: "Box"
    plural: "boxes"
    short_names: ["bx"]
    scope: SCOPE_PROJECT
  };
  string api_version = 1;
  string kind = 2;
  tower.meta.v1.ObjectMeta metadata = 3;
  BoxSpec spec = 4;
  BoxStatus status = 5;
}

// BoxSpec is what workstream wants. What the box is made of cannot change:
// a different recipe is a different box.
message BoxSpec {
  // background_work: tower sees a box's processes itself (StartProcess).
  reserved 7;
  reserved "background_work";
  // privileged_secret: a whole Secret as the environment, replaced by
  // privileged_secrets, which names each value and what to call it.
  reserved 5;
  reserved "privileged_secret";

  // The workstream the box belongs to, by id. A workstream's boxes and
  // machines share a network and reach each other by alias.
  string workstream = 1 [(tower.meta.v1.field).immutable = true];
  // The repositories to check out: the first at /workspace, each other at
  // /repos/<repository>. Empty is an empty box, which needs image.
  repeated Checkout checkouts = 2 [(tower.meta.v1.field).immutable = true];
  // Add-ons layered onto the image, such as "browser" or "desktop".
  repeated string addons = 3 [(tower.meta.v1.field).immutable = true];
  // An explicit base image, which skips the first checkout's devcontainer.
  // At most one of image and image_build is set.
  string image = 4 [(tower.meta.v1.field).immutable = true];
  // Never stopped for idleness while set: workstream's keep_box. A box
  // with a process running (EnvironmentService.StartProcess) is not either.
  bool keep = 6;
  // RUN_STATE_STOPPED when workstream hibernates the box. Stopping it ends
  // every process running in it.
  RunState run_state = 8;
  Resources resources = 9;
  // Values of Secrets in the same project that reach every command and
  // process run in the box, as environment variables named by their as;
  // none is not privileged. The values never enter a spec of a lower layer
  // (docs/decisions/secrets.md).
  repeated SecretRef privileged_secrets = 10 [(tower.meta.v1.field).immutable = true];
  // Values of Secrets in the same project written into the box as files,
  // at each start of its instance and before any command runs in it.
  repeated SecretFile secret_files = 11 [(tower.meta.v1.field).immutable = true];
  // An image built for the box from a Dockerfile, with its add-ons layered
  // on, as a container blueprint is, which skips the first checkout's
  // devcontainer. At most one of image and image_build is set.
  ImageBuild image_build = 12 [(tower.meta.v1.field).immutable = true];
}

// SecretFile is one value of a Secret written into a box as a file. The
// value enters no object, status, log or event.
message SecretFile {
  // A Secret in the same project.
  string secret = 1;
  string key = 2;
  // Where in the box, an absolute path.
  string path = 3;
  // The file's permission bits; 0 is 0600.
  uint32 mode = 4;
}

// ImageBuild is a box image's own build: a Dockerfile and the files its
// context holds beside it, 16 MiB in all at most.
message ImageBuild {
  string dockerfile = 1;
  // The context's files by their relative path, such as "etc/app.conf";
  // never "Dockerfile".
  map<string, bytes> files = 2;
}

// Checkout is one repository checked out in a box.
message Checkout {
  // A Repository in the same project, by name.
  string repository = 1;
  // A branch, tag or commit; empty is the repository's default branch.
  string ref = 2;
}

// BoxPhase is where a box is in its life.
enum BoxPhase {
  BOX_PHASE_UNSPECIFIED = 0;
  // Waiting for its turn.
  BOX_PHASE_PENDING = 1;
  // Its project has no Placement.
  BOX_PHASE_UNPLACED = 2;
  // Its image or golden is being built.
  BOX_PHASE_BUILDING = 3;
  // Its instance is being made or started.
  BOX_PHASE_STARTING = 4;
  BOX_PHASE_READY = 5;
  // Stopped, its disk kept; stopped_reason says why.
  BOX_PHASE_STOPPED = 6;
  // It cannot be made; the Ready condition says why.
  BOX_PHASE_FAILED = 7;
}

// BoxStatus is what tower reports about the box.
message BoxStatus {
  int64 observed_generation = 1;
  // Ready, with ImageBuilt and Materialized on the way to it.
  repeated tower.meta.v1.Condition conditions = 2;
  BoxPhase phase = 3;
  // Why a STOPPED box stopped: "Requested" (run_state) or "Idle".
  string stopped_reason = 4;
  // The Target it runs on.
  string target = 5;
  // The Goldens it was made from: its image, and the warm checkout it was
  // cloned from if its repository had one.
  string image_golden = 6;
  string warm_golden = 7;
  // The Instance that holds it.
  string instance = 8;
  // Its name on the workstream's network.
  string alias = 9;
  // When it was last used through tower, to within a minute: what idleness
  // is measured from.
  google.protobuf.Timestamp last_use_time = 10;
}

// BoxService manages boxes.
service BoxService {
  rpc GetBox(GetBoxRequest) returns (GetBoxResponse);
  rpc ListBoxes(ListBoxesRequest) returns (ListBoxesResponse);
  rpc WatchBoxes(WatchBoxesRequest) returns (stream WatchBoxesResponse);
  rpc ApplyBox(ApplyBoxRequest) returns (ApplyBoxResponse);
  rpc DeleteBox(DeleteBoxRequest) returns (DeleteBoxResponse);
  rpc UpdateBoxStatus(UpdateBoxStatusRequest) returns (UpdateBoxStatusResponse);
}

message GetBoxRequest {
  string project = 1;
  string name = 2;
}

message GetBoxResponse {
  Box box = 1;
}

message ListBoxesRequest {
  // Empty lists across every project the caller can read.
  string project = 1;
  string label_selector = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListBoxesResponse {
  repeated Box items = 1;
  string next_page_token = 2;
  int64 revision = 3;
}

message WatchBoxesRequest {
  // Empty watches every project the caller can read.
  string project = 1;
  string label_selector = 2;
  int64 since_revision = 3;
}

message WatchBoxesResponse {
  tower.meta.v1.EventType type = 1;
  Box box = 2;
  int64 revision = 3;
}

message ApplyBoxRequest {
  Box box = 1;
  // Refuses an existing object with ALREADY_EXISTS, changing nothing.
  bool create_only = 2;
}

message ApplyBoxResponse {
  Box box = 1;
  repeated string warnings = 2;
  bool created = 3;
}

message DeleteBoxRequest {
  string project = 1;
  string name = 2;
  optional int64 expected_resource_version = 3;
}

message DeleteBoxResponse {
  Box box = 1;
}

message UpdateBoxStatusRequest {
  string project = 1;
  string name = 2;
  BoxStatus status = 3;
  optional int64 expected_resource_version = 4;
}

message UpdateBoxStatusResponse {
  Box box = 1;
}
