syntax = "proto3";

package tower.environments.v1alpha1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// EnvironmentService is what workstream does in a box or a machine: run a
// command, read and write files, copy between two environments, refresh a
// box's origin, push a branch, and ask for a ticket to stream to a port
// directly. Only ROLE_WORKSTREAM may call it. Every call counts as a use of
// the environment; a box tower stopped for idleness is started first, and
// the call waits for it within its deadline. It is not a resource's
// service, so it is written by hand rather than generated. See
// docs/decisions/traffic.md.
service EnvironmentService {
  // Exec runs a command and streams its output, stdout and stderr in the
  // order they were written, then how it ended. The command runs for as
  // long as the call: a call that ends kills it. In a privileged box, tower
  // adds its Secret's values to the command's environment.
  rpc Exec(ExecRequest) returns (stream ExecResponse);
  // ReadFile streams up to limit bytes of a file from offset.
  rpc ReadFile(ReadFileRequest) returns (stream ReadFileResponse);
  // WriteFile writes one chunk of a file, making its directory: offset 0
  // replaces the file, and each later chunk starts where the file ends.
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  // CopyFile copies a file or a directory from one environment to another
  // of the same workstream. The bytes never leave the target.
  rpc CopyFile(CopyFileRequest) returns (CopyFileResponse);
  // FetchOrigin fetches the repositories of a box's checkouts into the
  // target's mirrors, then brings each checkout's origin/* up to them.
  rpc FetchOrigin(FetchOriginRequest) returns (FetchOriginResponse);
  // Push pushes a branch of a box's checkout to its repository, forcing
  // only with a lease. A repository without a credential is refused.
  rpc Push(PushRequest) returns (PushResponse);
  // IssueTicket returns where to stream to one port of an environment
  // directly, and the ticket to present there. On a hangar target it is
  // UNIMPLEMENTED: hangar forwards no port yet.
  rpc IssueTicket(IssueTicketRequest) returns (IssueTicketResponse);
}

// Environment names a box or a machine.
message Environment {
  string project = 1;
  oneof kind {
    string box = 2;
    string machine = 3;
  }
}

message ExecRequest {
  Environment environment = 1;
  oneof command {
    // The program and its arguments, run without a shell.
    Argv argv = 2;
    // A line run by /bin/sh -c.
    string shell = 3;
  }
  // The working directory; empty is the environment's default.
  string dir = 4;
  // Added to the environment's own for this command alone.
  map<string, string> env = 5;
  // Kills the command once it has run this long; unset is the call's
  // deadline alone.
  google.protobuf.Duration timeout = 6;
}

// Argv is a program and its arguments.
message Argv {
  repeated string args = 1;
}

message ExecResponse {
  oneof response {
    bytes stdout = 1;
    bytes stderr = 2;
    // The last response.
    ExecExit exit = 3;
  }
}

// ExecExit is how a command ended.
message ExecExit {
  int32 code = 1;
  // The command ran past its timeout and was killed; code is then 124,
  // as timeout(1) exits.
  bool timed_out = 2;
}

message ReadFileRequest {
  Environment environment = 1;
  string path = 2;
  int64 offset = 3;
  // At most 64 MiB, which unset is.
  int64 limit = 4;
}

message ReadFileResponse {
  oneof response {
    bytes data = 1;
    // The last response.
    ReadFileEnd end = 2;
  }
}

// ReadFileEnd says whether a read reached the end of its file.
message ReadFileEnd {
  // False when the file goes on past what was read: read again from where
  // this read ended.
  bool eof = 1;
}

message WriteFileRequest {
  Environment environment = 1;
  string path = 2;
  // At most 4 MiB.
  bytes data = 3;
  // Where data goes: 0 replaces the file; any other offset must be the
  // file's size, so a large file is written in chunks, in order.
  int64 offset = 4;
  // Permission bits; 0 is 0644.
  uint32 mode = 5;
}

message WriteFileResponse {}

message CopyFileRequest {
  Environment from = 1;
  string from_path = 2;
  Environment to = 3;
  string to_path = 4;
}

message CopyFileResponse {}

message FetchOriginRequest {
  // A box.
  Environment environment = 1;
}

message FetchOriginResponse {
  repeated FetchedCheckout checkouts = 1;
}

// FetchedCheckout is where one checkout's origin now is.
message FetchedCheckout {
  string repository = 1;
  // The commit its repository's default branch is at.
  string head = 2;
}

message PushRequest {
  // A box.
  Environment environment = 1;
  // The checkout's Repository, by name.
  string repository = 2;
  string branch = 3;
  // The commit the branch must be at on the forge for the push to go, as
  // --force-with-lease; empty for a branch that must not exist yet. A
  // branch elsewhere is ABORTED.
  string lease = 4;
}

message PushResponse {}

message IssueTicketRequest {
  Environment environment = 1;
  int32 port = 2;
}

message IssueTicketResponse {
  // Where to connect.
  string url = 1;
  // What to present there, valid for this environment and port alone.
  string ticket = 2;
  google.protobuf.Timestamp expire_time = 3;
}
