syntax = "proto3";

package tower.environments.v1alpha1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "tower/environments/v1alpha1/common.proto";

// EnvironmentService is what workstream does in a box or a machine: run a
// command, read and write files, copy between two environments, refresh a
// box's origin, push a branch, and ask for a ticket to stream to a port
// directly. Only ROLE_WORKSTREAM may call it. Every call counts as a use of
// the environment; a box tower stopped for idleness is started first, and
// the call waits for it within its deadline. In a machine whose blueprint
// names a run_as user, commands and processes run as that user, in its
// home unless given a directory, and a file written or copied there is
// handed to it (docs/decisions/machine-blueprints.md). It is not a resource's
// service, so it is written by hand rather than generated. See
// docs/decisions/traffic.md.
service EnvironmentService {
  // Exec runs a command and streams its output, stdout and stderr in the
  // order they were written, then how it ended. The command runs for as
  // long as the call: a call that ends kills it. In a privileged box, tower
  // adds its Secret's values to the command's environment.
  rpc Exec(ExecRequest) returns (stream ExecResponse);
  // ReadFile streams up to limit bytes of a file from offset.
  rpc ReadFile(ReadFileRequest) returns (stream ReadFileResponse);
  // WriteFile writes one chunk of a file, making its directory: offset 0
  // replaces the file, and each later chunk starts where the file ends.
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  // CopyFile copies a file or a directory from one environment to another
  // of the same workstream. The bytes never leave the target.
  rpc CopyFile(CopyFileRequest) returns (CopyFileResponse);
  // FetchOrigin fetches the repositories of a box's checkouts into the
  // target's mirrors, then brings each checkout's origin/* up to them.
  rpc FetchOrigin(FetchOriginRequest) returns (FetchOriginResponse);
  // Push pushes a branch of a box's checkout to its repository, forcing
  // only with a lease. A repository without a credential is refused.
  rpc Push(PushRequest) returns (PushResponse);
  // IssueTicket returns where to stream to one port of an environment
  // directly, and the ticket to present there. On a hangar target it is
  // UNIMPLEMENTED: hangar forwards no port yet.
  rpc IssueTicket(IssueTicketRequest) returns (IssueTicketResponse);
  // StartProcess starts a process in a box or a machine and returns its id
  // at once: a background job or a service, which outlives the call, unlike
  // Exec's command. In a privileged box, tower adds its Secret's values to
  // the process's environment. While a process runs, the box is never
  // stopped for idleness (a machine never is); stopping the environment
  // ends it. A machine's processes are read from the machine itself: while
  // it is stopped, they are not listed.
  rpc StartProcess(StartProcessRequest) returns (StartProcessResponse);
  // AttachProcess streams a process's output from an offset, stdout and
  // stderr in the order written. With follow it goes on until the process
  // ends; it ends with where output is held from and resumes, and the
  // process's exit once it has one. Attaching again from the offset it
  // ended at loses nothing the log still holds.
  rpc AttachProcess(AttachProcessRequest) returns (stream AttachProcessResponse);
  // SignalProcess sends a signal to a process's group.
  rpc SignalProcess(SignalProcessRequest) returns (SignalProcessResponse);
  // ListProcesses lists an environment's processes, running and finished.
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
}

// Environment names a box or a machine.
message Environment {
  string project = 1;
  oneof kind {
    string box = 2;
    string machine = 3;
  }
}

message ExecRequest {
  Environment environment = 1;
  oneof command {
    // The program and its arguments, run without a shell.
    Argv argv = 2;
    // A line run by /bin/sh -c.
    string shell = 3;
  }
  // The working directory; empty is the environment's default, which in
  // a machine with a run_as user is that user's home.
  string dir = 4;
  // Added to the environment's own for this command alone.
  map<string, string> env = 5;
  // Kills the command once it has run this long; unset is the call's
  // deadline alone.
  google.protobuf.Duration timeout = 6;
}

// Argv is a program and its arguments.
message Argv {
  repeated string args = 1;
}

message ExecResponse {
  oneof response {
    bytes stdout = 1;
    bytes stderr = 2;
    // The last response.
    ExecExit exit = 3;
  }
}

// ExecExit is how a command ended.
message ExecExit {
  int32 code = 1;
  // The command ran past its timeout and was killed; code is then 124,
  // as timeout(1) exits.
  bool timed_out = 2;
}

message ReadFileRequest {
  Environment environment = 1;
  string path = 2;
  int64 offset = 3;
  // At most 64 MiB, which unset is.
  int64 limit = 4;
}

message ReadFileResponse {
  oneof response {
    bytes data = 1;
    // The last response.
    ReadFileEnd end = 2;
  }
}

// ReadFileEnd says whether a read reached the end of its file.
message ReadFileEnd {
  // False when the file goes on past what was read: read again from where
  // this read ended.
  bool eof = 1;
}

message WriteFileRequest {
  Environment environment = 1;
  string path = 2;
  // At most 4 MiB.
  bytes data = 3;
  // Where data goes: 0 replaces the file; any other offset must be the
  // file's size, so a large file is written in chunks, in order.
  int64 offset = 4;
  // Permission bits; 0 is 0644.
  uint32 mode = 5;
}

message WriteFileResponse {}

message CopyFileRequest {
  Environment from = 1;
  string from_path = 2;
  Environment to = 3;
  string to_path = 4;
}

message CopyFileResponse {}

message FetchOriginRequest {
  // A box.
  Environment environment = 1;
}

message FetchOriginResponse {
  repeated FetchedCheckout checkouts = 1;
}

// FetchedCheckout is where one checkout's origin now is.
message FetchedCheckout {
  string repository = 1;
  // The commit its repository's default branch is at.
  string head = 2;
}

message PushRequest {
  // A box.
  Environment environment = 1;
  // The checkout's Repository, by name.
  string repository = 2;
  string branch = 3;
  // The commit the branch must be at on the forge for the push to go, as
  // --force-with-lease; empty for a branch that must not exist yet. A
  // branch elsewhere is ABORTED.
  string lease = 4;
}

message PushResponse {}

message IssueTicketRequest {
  Environment environment = 1;
  int32 port = 2;
}

message StartProcessRequest {
  // A box or a machine.
  Environment environment = 1;
  oneof command {
    // The program and its arguments, run without a shell.
    Argv argv = 2;
    // A line run by /bin/sh -c.
    string shell = 3;
  }
  // The working directory; empty is the environment's default, which in
  // a machine with a run_as user is that user's home.
  string dir = 4;
  // Added to the environment's own for this process alone.
  map<string, string> env = 5;
  // A name for people, such as "dev server"; tower does not read it.
  string name = 6;
  // Runs it on the box's boost rather than in the box: a larger instance of
  // the box's, made for it if the box has none (docs/decisions/boost.md).
  // Unset runs it in the box. A box on a hangar target alone has one.
  BoostIntent boost = 7;
  // The ticket of a start answered pending, asked about again with the
  // same request: it is answered pending again, or started. A ticket not
  // asked about for two minutes is dropped.
  string pending = 8;
  // With pending, gives the ticket up instead: nothing starts, and its
  // place goes to the next.
  bool cancel = 9;
}

// BoostIntent is the boost a process asks for.
message BoostIntent {
  oneof size {
    // The target's boost_resources.
    bool on = 1;
    // A size: cpu and memory, each unset one the target's default. It is
    // held to the target's boost_max, and its cpus to hangar's shapes
    // (512Mi to 8Gi of memory per vCPU).
    Resources resources = 2;
  }
}

message StartProcessResponse {
  // The process's id in its environment; empty while pending says the
  // start is pending.
  string process = 1;
  // Set when it has not started yet: ask again with its ticket.
  PendingStart pending = 2;
  // Where it runs, once started.
  RanOn ran_on = 3;
}

// PendingStart is a boosted start that has not started yet, as tower
// answers it at once rather than waiting: the caller asks again with its
// ticket, or gives the ticket up, and decides meanwhile whether to wait.
message PendingStart {
  string ticket = 1;
  PendingReason reason = 2;
  // Why, for people.
  string message = 3;
  // Its place in its target's queue, 1 first; 0 when not queued.
  int32 position = 4;
  // About how long until it starts: at least this, as far as tower knows.
  google.protobuf.Duration estimated_wait = 5;
}

// PendingReason is why a start is pending.
enum PendingReason {
  PENDING_REASON_UNSPECIFIED = 0;
  // The target's boosts hold its boost_budget, or its Plan's quota left
  // is less than the boost: it waits its turn, first come first served,
  // workstream by workstream in turn.
  PENDING_REASON_QUEUED_BUDGET = 1;
  // The box's boost is being made: its instance started, the box's
  // checkouts and setup steps run in it.
  PENDING_REASON_BOOST_STARTING = 2;
  // The box's boost is smaller than asked and runs a process: it is made
  // again larger once its processes end.
  PENDING_REASON_BOOST_BUSY = 3;
}

// RanOn is where a process runs or ran.
message RanOn {
  RanOnKind kind = 1;
  // The size of what it runs on: cpu and memory.
  Resources resources = 2;
}

enum RanOnKind {
  RAN_ON_KIND_UNSPECIFIED = 0;
  RAN_ON_KIND_BOX = 1;
  RAN_ON_KIND_BOOST = 2;
}

message AttachProcessRequest {
  // A box or a machine.
  Environment environment = 1;
  string process = 2;
  // Where in the process's output to start: an offset a previous attach
  // ended at, or 0 for everything held.
  int64 offset = 3;
  // Go on as the process writes, until it ends; without it, send what is
  // there and end, as a client that polls does.
  bool follow = 4;
}

message AttachProcessResponse {
  oneof response {
    ProcessOutput output = 1;
    // The last response.
    ProcessEnd end = 2;
  }
}

// OutputStream is which of a process's outputs a chunk was written to.
enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  OUTPUT_STREAM_STDOUT = 1;
  OUTPUT_STREAM_STDERR = 2;
}

// ProcessOutput is a chunk of a process's output.
message ProcessOutput {
  OutputStream stream = 1;
  // Where the chunk starts in the process's output, stdout and stderr
  // counted together.
  int64 offset = 2;
  bytes data = 3;
}

// ProcessEnd is how an attach ended.
message ProcessEnd {
  // The oldest offset the target still holds: a process's log is capped on
  // the target (64 MiB unless the target says otherwise), its oldest
  // output dropped first. Output before it is gone.
  int64 held_from = 1;
  // Where to attach again to read what comes next.
  int64 next_offset = 2;
  // How the process ended; unset while it runs.
  ProcessExit exit = 3;
}

// Signal is a signal a process's group can be sent.
enum Signal {
  SIGNAL_UNSPECIFIED = 0;
  SIGNAL_TERM = 1;
  SIGNAL_KILL = 2;
  SIGNAL_INT = 3;
}

// ProcessExit is how a process ended, and what it used, its children
// included. The usage fields are set for a process of a box on a hangar
// target, where each process runs in a cgroup of its own; they are unset
// in a machine, on a hostd target, for a process whose box could make no
// cgroup, and for one whose box stopped under it. Each is also unset
// where the box's kernel does not offer it.
message ProcessExit {
  // Its exit code; 128 plus the signal's number when a signal ended it.
  int32 code = 1;
  // The signal that ended it, unset if it exited.
  Signal signal = 2;
  // Its peak memory, in bytes (memory.peak).
  optional int64 memory_peak_bytes = 3;
  // Whether an OOM killed it, its children with it. A box's processes
  // started through tower are held together to the box's memory less a
  // reserve tower keeps; past it, one of them, any one, is killed whole.
  // Only the box's processes not started through tower are sure to run on.
  optional bool oom_killed = 4;
  // The CPU time it used (cpu.stat's usage_usec).
  google.protobuf.Duration cpu_usage = 5;
  // The time it was runnable but waited for a CPU (cpu.pressure's "some"
  // total): how much a larger box would have sped it up.
  google.protobuf.Duration cpu_wait = 6;
  // How long it ran.
  google.protobuf.Duration wall = 7;
}

message SignalProcessRequest {
  // A box or a machine.
  Environment environment = 1;
  string process = 2;
  Signal signal = 3;
}

message SignalProcessResponse {}

message ListProcessesRequest {
  // A box or a machine.
  Environment environment = 1;
}

message ListProcessesResponse {
  // Oldest first. A finished process is kept until its environment is
  // deleted, or until it holds more finished processes than its target
  // keeps (100 unless the target says otherwise), the oldest going first.
  repeated ProcessInfo processes = 1;
}

// ProcessInfo is one process of a box or a machine.
message ProcessInfo {
  string process = 1;
  string name = 2;
  // Its command line, cut short.
  string command = 3;
  google.protobuf.Timestamp start_time = 4;
  bool running = 5;
  // How it ended; unset while it runs.
  ProcessExit exit = 6;
  // Where it runs or ran: a box's processes and its boost's are listed
  // together. A process of a boost deleted since keeps its exit, and its
  // output is gone.
  RanOn ran_on = 7;
}

message IssueTicketResponse {
  // Where to connect.
  string url = 1;
  // What to present there, valid for this environment and port alone.
  string ticket = 2;
  google.protobuf.Timestamp expire_time = 3;
}
