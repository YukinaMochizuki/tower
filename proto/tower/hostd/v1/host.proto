syntax = "proto3";

// The protocol between tower and hostd, which hostd serves on the tunnel it
// opens to tower (internal/tunnel). It is internal, not part of the API,
// but its compatibility is held by buf breaking all the same: tower and a
// host may run different versions while one is upgraded. It carries
// provider.Provider's imperative half, one call per operation; a failure's
// kind of provider error rides in its error's metadata. See
// docs/decisions/traffic.md.
package tower.hostd.v1;

import "google/protobuf/timestamp.proto";

// HostService is what tower asks of the host of one target. Every call may
// fail UNAVAILABLE when the host cannot tell what happened.
service HostService {
  // Exec runs a command in a running instance for as long as the call
  // lasts: once the call ends, the command is killed. The first request
  // starts it; later ones carry its stdin, which ends with the requests.
  // The responses carry its output in the order it was written and, last,
  // its exit code.
  rpc Exec(stream ExecRequest) returns (stream ExecResponse);
  // ReadFile streams a file of a running instance.
  rpc ReadFile(ReadFileRequest) returns (stream ReadFileResponse);
  // WriteFile writes a file of a running instance, making its directory.
  // The first request says where; later ones carry the bytes.
  rpc WriteFile(stream WriteFileRequest) returns (WriteFileResponse);
  // Copy copies a path from one instance of the target to another, on the
  // target.
  rpc Copy(CopyRequest) returns (CopyResponse);
  // BuildImage builds an image from a build context and pushes it to the
  // registry. The first request says where it goes; later ones carry the
  // context, a tar stream, unless the first names a mirror's work tree as
  // the context, which stays on the host.
  rpc BuildImage(stream BuildImageRequest) returns (BuildImageResponse);
  // ResolveImage reads what an image reference names from its registry,
  // without pulling it.
  rpc ResolveImage(ResolveImageRequest) returns (ResolveImageResponse);
  // Capture makes a golden artifact of a stopped instance's disk.
  rpc Capture(CaptureRequest) returns (CaptureResponse);
  // DeleteArtifact deletes a golden artifact; one already gone is no
  // error.
  rpc DeleteArtifact(DeleteArtifactRequest) returns (DeleteArtifactResponse);
  // Fetch brings a branch into the target's mirror of a repository.
  rpc Fetch(FetchRequest) returns (FetchResponse);
  // Checkout clones a mirror into a running instance, the mirror its
  // origin.
  rpc Checkout(CheckoutRequest) returns (CheckoutResponse);
  // UpdateOrigin brings a checkout's origin/* up to its mirror.
  rpc UpdateOrigin(UpdateOriginRequest) returns (UpdateOriginResponse);
  // CommitsBehind counts the commits on a mirror's branch since a commit.
  rpc CommitsBehind(CommitsBehindRequest) returns (CommitsBehindResponse);
  // ReadMirror reads paths of a mirror's work tree at a ref: what each is
  // and, if asked, a small file's content.
  rpc ReadMirror(ReadMirrorRequest) returns (ReadMirrorResponse);
  // Push pushes a branch of an instance's checkout through the mirror,
  // forcing only with a lease.
  rpc Push(PushRequest) returns (PushResponse);
  // Ticket says where a direct stream to a port of a running instance
  // connects. tower signs the ticket the stream presents there.
  rpc Ticket(TicketRequest) returns (TicketResponse);
  // StartProcess starts a process in a running instance, supervised on
  // the host or in the instance, not by the call: it runs until it exits,
  // is signalled, or its instance stops, which ends every process of it.
  // Its output goes to a log of its own on the host, capped (64 MiB unless
  // the host is set otherwise), the oldest output dropped first. A finished
  // process is kept, log and exit, until its instance is deleted or the
  // instance holds more finished processes than the host keeps (100 unless
  // set otherwise), the oldest going first. The instance's status reports
  // how many run.
  rpc StartProcess(StartProcessRequest) returns (StartProcessResponse);
  // AttachProcess streams a process's log from an offset, then, with
  // follow, what it writes until it ends; last, where the log is held from
  // and resumes, and the exit once there is one.
  rpc AttachProcess(AttachProcessRequest) returns (stream AttachProcessResponse);
  // SignalProcess signals a process's group.
  rpc SignalProcess(SignalProcessRequest) returns (SignalProcessResponse);
  // ListProcesses lists an instance's processes, running and finished,
  // oldest first.
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
}

// Instance names an Instance object of the target.
message Instance {
  string project = 1;
  string name = 2;
}

message ExecRequest {
  oneof request {
    // The first request, and only it.
    ExecStart start = 1;
    // A chunk of stdin.
    bytes stdin = 2;
  }
}

// ExecStart is the command an Exec runs.
message ExecStart {
  Instance instance = 1;
  // The program and its arguments, run without a shell.
  repeated string command = 2;
  // Added to the instance's environment for this command alone. It may
  // hold secret values: the host never writes or logs them.
  map<string, string> env = 3;
  // Empty is the instance's default.
  string dir = 4;
  // Whether stdin follows; without it, the command's stdin is closed at
  // once.
  bool stdin = 5;
}

message ExecResponse {
  oneof response {
    bytes stdout = 1;
    bytes stderr = 2;
    // How the command ended; the last response.
    int32 exit_code = 3;
  }
}

message ReadFileRequest {
  Instance instance = 1;
  string path = 2;
}

message ReadFileResponse {
  bytes data = 1;
}

message WriteFileRequest {
  oneof request {
    // The first request, and only it.
    WriteFileStart start = 1;
    bytes data = 2;
  }
}

// WriteFileStart says where a WriteFile writes.
message WriteFileStart {
  Instance instance = 1;
  string path = 2;
  // Permission bits, such as 0644.
  uint32 mode = 3;
  // 0 replaces the file; any other offset writes a later chunk, which
  // must start where the file ends.
  int64 offset = 4;
}

message WriteFileResponse {}

message CopyRequest {
  Instance from = 1;
  string from_path = 2;
  Instance to = 3;
  string to_path = 4;
}

message CopyResponse {}

message BuildImageRequest {
  oneof request {
    // The first request, and only it.
    BuildImageStart start = 1;
    // A chunk of the build context.
    bytes context = 2;
  }
}

// BuildImageStart says where a built image goes, and what it is built
// from.
message BuildImageStart {
  // Where in the registry, such as "web/box-images".
  string repository = 1;
  // The context's directory in the tar or the work tree, empty for its
  // root.
  string dir = 2;
  // The Dockerfile's path in the tar or the work tree; empty is
  // dir/Dockerfile.
  string dockerfile = 3;
  // When set, the context is this mirror's work tree, and no context
  // follows.
  MirrorSource mirror = 4;
}

// MirrorSource is a mirror's work tree at a ref.
message MirrorSource {
  string mirror = 1;
  // A branch, tag or commit; empty is the branch the mirror fetched.
  string ref = 2;
}

message ResolveImageRequest {
  string ref = 1;
}

message ResolveImageResponse {
  // The manifest's digest, such as "sha256:...".
  string digest = 1;
  // The user it runs as, empty for root.
  string user = 2;
}

message BuildImageResponse {
  // The image's reference by digest.
  string image = 1;
}

message CaptureRequest {
  Instance instance = 1;
}

message CaptureResponse {
  string artifact = 1;
  // What it holds on the target, in bytes.
  uint64 size = 2;
}

message DeleteArtifactRequest {
  string artifact = 1;
}

message DeleteArtifactResponse {}

message FetchRequest {
  // Names the mirror, one per repository, such as "web/api".
  string mirror = 1;
  string url = 2;
  // Reads the repository; empty reads it anonymously. The host never
  // writes or logs it.
  string token = 3;
  string branch = 4;
}

message FetchResponse {
  // The commit the branch is at.
  string head = 1;
}

message CheckoutRequest {
  Instance instance = 1;
  string mirror = 2;
  // A branch, tag or commit; empty is the branch the mirror fetched.
  string ref = 3;
  string dir = 4;
}

message CheckoutResponse {
  string commit = 1;
}

message UpdateOriginRequest {
  Instance instance = 1;
  string mirror = 2;
  // The checkout, such as /workspace.
  string dir = 3;
}

message UpdateOriginResponse {}

message CommitsBehindRequest {
  string mirror = 1;
  string commit = 2;
  string branch = 3;
}

message CommitsBehindResponse {
  int32 commits = 1;
}

message ReadMirrorRequest {
  MirrorSource source = 1;
  // Relative to the work tree's root; empty is the root.
  repeated string paths = 2;
  // Whether to give the content of each file of at most 1 MiB.
  bool content = 3;
}

message ReadMirrorResponse {
  // The commit the ref is at.
  string commit = 1;
  // The paths that are there.
  map<string, MirrorEntry> entries = 2;
}

// MirrorEntry is one path of a mirror's work tree.
message MirrorEntry {
  // Its git object id; a directory's is its tree's.
  string object = 1;
  bool dir = 2;
  int64 size = 3;
  // A file's content, when asked for and small enough.
  bytes content = 4;
}

message PushRequest {
  Instance instance = 1;
  // The checkout in the instance, such as /workspace.
  string dir = 2;
  string mirror = 3;
  string url = 4;
  // Writes the repository; it never enters the instance, and the host
  // never writes or logs it.
  string token = 5;
  string branch = 6;
  // The commit the branch must be at for the push to go; empty for a
  // branch that must not exist yet.
  string lease = 7;
}

message PushResponse {}

message TicketRequest {
  Instance instance = 1;
  int32 port = 2;
}

message StartProcessRequest {
  Instance instance = 1;
  // The program and its arguments, run without a shell.
  repeated string command = 2;
  // Added to the instance's environment for this process alone. It may
  // hold secret values: the host never writes or logs them.
  map<string, string> env = 3;
  // Empty is the instance's default.
  string dir = 4;
  // A name for people.
  string name = 5;
}

message StartProcessResponse {
  // Its id, unique in its instance.
  string process = 1;
}

message AttachProcessRequest {
  Instance instance = 1;
  string process = 2;
  int64 offset = 3;
  bool follow = 4;
}

message AttachProcessResponse {
  oneof response {
    ProcessOutput output = 1;
    // The last response.
    ProcessEnd end = 2;
  }
}

// OutputStream is which output a chunk was written to.
enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  OUTPUT_STREAM_STDOUT = 1;
  OUTPUT_STREAM_STDERR = 2;
}

// ProcessOutput is a chunk of a process's log.
message ProcessOutput {
  OutputStream stream = 1;
  // Where it starts in the log, stdout and stderr counted together.
  int64 offset = 2;
  bytes data = 3;
}

// ProcessEnd is how an attach ended.
message ProcessEnd {
  // The oldest offset the log holds.
  int64 held_from = 1;
  // Where the next attach starts to read what comes next.
  int64 next_offset = 2;
  // Unset while the process runs.
  ProcessExit exit = 3;
}

// Signal is what a process's group can be sent.
enum Signal {
  SIGNAL_UNSPECIFIED = 0;
  SIGNAL_TERM = 1;
  SIGNAL_KILL = 2;
  SIGNAL_INT = 3;
}

// ProcessExit is how a process ended.
message ProcessExit {
  // 128 plus the signal's number when a signal ended it.
  int32 code = 1;
  // Unset if it exited.
  Signal signal = 2;
}

message SignalProcessRequest {
  Instance instance = 1;
  string process = 2;
  Signal signal = 3;
}

message SignalProcessResponse {}

message ListProcessesRequest {
  Instance instance = 1;
}

message ListProcessesResponse {
  repeated Process processes = 1;
}

// Process is one process of an instance.
message Process {
  string process = 1;
  string name = 2;
  repeated string command = 3;
  google.protobuf.Timestamp start_time = 4;
  // Unset while it runs.
  ProcessExit exit = 5;
}

message TicketResponse {
  // Where the stream connects, presenting tower's ticket.
  string url = 1;
  // When the URL stops working, if the host bounds it.
  google.protobuf.Timestamp expire_time = 2;
}
