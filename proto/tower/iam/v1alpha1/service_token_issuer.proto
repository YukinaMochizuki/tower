syntax = "proto3";

package tower.iam.v1alpha1;

import "google/protobuf/duration.proto";
import "tower/iam/v1alpha1/service_token.proto";

// ServiceTokenIssuerService issues service tokens' secrets. Each call
// returns a secret once: tower keeps only its SHA-256, so nothing can show it
// again. Only ROLE_ADMIN, and root on the host through the admin socket, may
// call it. It is not a resource's service, so it is written by hand rather
// than generated. See docs/decisions/authentication.md.
service ServiceTokenIssuerService {
  // CreateServiceToken creates a token with its first secret. The name must
  // be free (ALREADY_EXISTS otherwise).
  rpc CreateServiceToken(CreateServiceTokenRequest) returns (CreateServiceTokenResponse);
  // RotateServiceToken issues a new secret for a token. The one it had
  // stops working the moment the new one is stored.
  rpc RotateServiceToken(RotateServiceTokenRequest) returns (RotateServiceTokenResponse);
}

message CreateServiceTokenRequest {
  string name = 1;
  string description = 2;
  Role role = 3;
  // As ServiceTokenSpec.target.
  string target = 4;
  // How long the secret works: at least an hour, at most three years.
  // Unset is a year.
  google.protobuf.Duration duration = 5;
}

message CreateServiceTokenResponse {
  ServiceToken service_token = 1;
  // The secret, twr_ and 43 more characters. It is never shown again.
  string secret = 2;
}

message RotateServiceTokenRequest {
  string name = 1;
  // As CreateServiceTokenRequest.duration.
  google.protobuf.Duration duration = 2;
}

message RotateServiceTokenResponse {
  ServiceToken service_token = 1;
  // The new secret. It is never shown again.
  string secret = 2;
}
