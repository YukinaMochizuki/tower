syntax = "proto3";

package tower.secrets.v1alpha1;

import "tower/meta/v1/meta.proto";
import "tower/meta/v1/options.proto";

// Secret holds credentials for tower to use on a project's behalf: a
// privileged profile's credentials, what a blueprint needs, a registry
// login. Its values are write-only: apply sets them, and no answer, event,
// log line or error ever holds them again. They are stored encrypted, and
// tower hands them only to the one environment that uses them, never into a
// spec of a lower layer. See docs/decisions/secrets.md.
message Secret {
  option (tower.meta.v1.resource) = {
    kind: "Secret"
    plural: "secrets"
    scope: SCOPE_PROJECT
  };
  string api_version = 1;
  string kind = 2;
  tower.meta.v1.ObjectMeta metadata = 3;
  SecretSpec spec = 4;
  SecretStatus status = 5;
}

// SecretSpec is what the secret holds.
message SecretSpec {
  SecretType type = 1 [(tower.meta.v1.field).immutable = true];
  // The values, by key, at most 64 KiB in all. Write-only: every apply
  // carries them, and every answer leaves them out. A registry-auth secret
  // holds one key, ".dockerconfigjson", in the Docker config format, as
  // docker login writes it. An opaque secret's keys are environment variable
  // names.
  map<string, bytes> data = 2;
  // What the apiserver stores of data, encrypted. It is the apiserver's
  // alone: an apply that sets it is refused, and no answer holds it.
  SealedData sealed = 3;
}

// SecretType says what a secret holds and how its data is checked.
enum SecretType {
  // Refused.
  SECRET_TYPE_UNSPECIFIED = 0;
  // A container registry login, in the Docker config format.
  SECRET_TYPE_REGISTRY_AUTH = 1;
  // Values by environment variable name, as a privileged profile's
  // credentials or a blueprint's required secrets.
  SECRET_TYPE_OPAQUE = 2;
}

// SealedData is a secret's data encrypted under a key of its own, which is
// itself encrypted under tower's key-encryption key.
message SealedData {
  // Names the key-encryption key that wrapped wrapped_key.
  string kek_id = 1;
  // The secret's own key, encrypted under the key-encryption key.
  bytes wrapped_key = 2;
  // The data, encrypted under the secret's own key.
  bytes nonce = 3;
  bytes ciphertext = 4;
  // An HMAC of the data, as status.content_hmac shows it.
  string content_hmac = 5;
}

// SecretStatus is what can be said of a secret without its values.
message SecretStatus {
  int64 observed_generation = 1;
  repeated tower.meta.v1.Condition conditions = 2;
  // The keys data holds.
  repeated string keys = 3;
  // A keyed hash of the data, which changes when the data does; it cannot
  // be checked against a guess without tower's key.
  string content_hmac = 4;
  // The registries a registry-auth secret holds a login for, by host.
  repeated string registries = 5;
}

// SecretService manages secrets.
service SecretService {
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc WatchSecrets(WatchSecretsRequest) returns (stream WatchSecretsResponse);
  rpc ApplySecret(ApplySecretRequest) returns (ApplySecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc UpdateSecretStatus(UpdateSecretStatusRequest) returns (UpdateSecretStatusResponse);
}

message GetSecretRequest {
  string project = 1;
  string name = 2;
}

message GetSecretResponse {
  Secret secret = 1;
}

message ListSecretsRequest {
  // Empty lists across every project the caller can read.
  string project = 1;
  string label_selector = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListSecretsResponse {
  repeated Secret items = 1;
  string next_page_token = 2;
  int64 revision = 3;
}

message WatchSecretsRequest {
  // Empty watches every project the caller can read.
  string project = 1;
  string label_selector = 2;
  int64 since_revision = 3;
}

message WatchSecretsResponse {
  tower.meta.v1.EventType type = 1;
  Secret secret = 2;
  int64 revision = 3;
}

message ApplySecretRequest {
  Secret secret = 1;
  // Refuses an existing object with ALREADY_EXISTS, changing nothing.
  bool create_only = 2;
}

message ApplySecretResponse {
  Secret secret = 1;
  repeated string warnings = 2;
  bool created = 3;
}

message DeleteSecretRequest {
  string project = 1;
  string name = 2;
  optional int64 expected_resource_version = 3;
}

message DeleteSecretResponse {
  Secret secret = 1;
}

message UpdateSecretStatusRequest {
  string project = 1;
  string name = 2;
  SecretStatus status = 3;
  optional int64 expected_resource_version = 4;
}

message UpdateSecretStatusResponse {
  Secret secret = 1;
}
