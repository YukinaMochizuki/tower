# Runs after buf.gen.yaml: protoc-gen-tower imports the generated
# tower.meta.v1 package to read resource declarations.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/YukinaMochizuki/tower/gen/go
plugins:
  - local: [go, run, ./tools/protoc-gen-tower]
    out: gen/go
    opt: [mode=registry, domain=tower.hangarlab.cloud]
    strategy: all
  - local: [go, run, ./tools/protoc-gen-tower]
    out: gen/go
    opt: [mode=schema, domain=tower.hangarlab.cloud]
    strategy: all
  - local: [go, run, ./tools/protoc-gen-tower]
    out: internal/apiserver/servicegen
    opt: mode=server
    strategy: all
